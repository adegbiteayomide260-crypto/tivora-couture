<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product — Tivora Couture</title>
<link rel="icon" href="assets/icons/favicon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#3d0a19">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Tangerine:wght@400;700&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/responsive.css">
<link rel="stylesheet" href="css/animations.css">
<style>
  .product-layout { display: grid; gap: var(--space-xl); grid-template-columns: 1fr; }
  @media (min-width: 900px) { .product-layout { grid-template-columns: 1.1fr 1fr; } }
  .gallery-main { aspect-ratio: 3/4; overflow: hidden; background: var(--cream-300); }
  .gallery-main img { width: 100%; height: 100%; object-fit: cover; cursor: zoom-in; }
  #productThumbs { display: flex; gap: var(--space-2xs); margin-top: var(--space-2xs); }
  .thumb-btn { width: 64px; height: 80px; overflow: hidden; border: 1px solid transparent; padding: 0; background: none; }
  .thumb-btn img { width: 100%; height: 100%; object-fit: cover; }
  .thumb-btn.active { border-color: var(--gold-500); }
  .variant-chip { border: 1px solid var(--line); padding: 0.5rem 1rem; font-size: 0.82rem; background: var(--white); margin: 0 6px 6px 0; }
  .variant-chip.active { border-color: var(--wine-900); background: var(--wine-900); color: var(--cream-100); }
  .product-actions { display: flex; gap: var(--space-sm); margin-top: var(--space-md); flex-wrap: wrap; }
  #productQty { width: 70px; border: 1px solid var(--line); padding: 0.85rem; text-align: center; }
  .info-block { border-top: 1px solid var(--line); padding-top: var(--space-sm); margin-top: var(--space-md); }
  .info-block h4 { font-size: 0.78rem; letter-spacing: 0.1em; color: var(--ink-500); margin-bottom: 4px; }
  .zoom-lightbox { position: fixed; inset: 0; background: rgba(32,21,18,0.92); z-index: 300; display: none; align-items: center; justify-content: center; padding: var(--space-lg); }
  .zoom-lightbox.open { display: flex; }
  .zoom-lightbox img { max-width: 100%; max-height: 90vh; object-fit: contain; }
  .zoom-close { position: absolute; top: var(--space-md); right: var(--space-md); color: var(--cream-100); background: none; border: none; font-size: 0.9rem; letter-spacing: 0.08em; }
</style>
</head>
<body>
<div id="site-header"></div>

<header class="page-banner">
  <div class="container">
    <p class="breadcrumb">HOME / SHOP / PRODUCT</p>
    <h1 style="font-size:1.6rem;">Product Detail</h1>
  </div>
</header>

<section class="section">
  <div class="container">
    <div id="productNotFound" class="empty-state" hidden>
      <div class="glyph">Tivora</div>
      <p>We couldn't find this piece — it may have sold out or moved. Explore the current collection instead.</p>
      <div class="actions"><a href="shop.html" class="btn btn-primary">Back to Shop</a></div>
    </div>

    <div class="product-layout" id="productRoot" hidden>
      <div class="gallery">
        <div class="gallery-main"><img id="productMainImage" src="" alt="" onclick="document.getElementById('zoomLightbox').classList.add('open')"></div>
        <div id="productThumbs"></div>
      </div>
      <div class="product-info">
        <h1 id="productName" style="font-size:2rem;"></h1>
        <p class="price" id="productPrice" style="font-size:1.2rem; color:var(--gold-600); margin-top:6px;"></p>
        <p class="lede" id="productDescription" style="margin-top:var(--space-md);"></p>

        <div style="margin-top:var(--space-md);">
          <div id="productSizes"></div>
          <div id="productColors"></div>
        </div>

        <div class="product-actions">
          <label for="productQty" class="visually-hidden">Quantity</label>
          <input type="number" id="productQty" value="1" min="1">
          <button type="button" id="productAddToCart" class="btn btn-primary">Add to Cart</button>
          <button type="button" id="productWishlistBtn" class="wishlist-toggle" style="position:static; width:48px; height:48px;" aria-label="Add to wishlist">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 20s-7-4.35-9.5-8.5C.5 8 2 4.5 5.5 4a5 5 0 0 1 6.5 3 5 5 0 0 1 6.5-3C22 4.5 23.5 8 21.5 11.5 19 15.65 12 20 12 20Z"/></svg>
          </button>
          <button type="button" id="productOrderNow" class="btn btn-outline">Order Now</button>
        </div>

        <div class="info-block">
          <h4>MADE-TO-ORDER &amp; PREPARATION</h4>
          <p id="productPrepTime" class="muted"></p>
        </div>
        <div class="info-block">
          <h4>CARE INSTRUCTIONS</h4>
          <p id="productCare" class="muted"></p>
        </div>
        <div class="info-block">
          <a href="size-guide.html" class="btn-text">View Size Guide →</a>
        </div>
      </div>
    </div>
  </div>
</section>

<section class="section" style="padding-top:0;">
  <div class="container">
    <div class="section-head"><p class="eyebrow">RECENTLY VIEWED</p><h2>You May Also Recall</h2></div>
    <div class="product-grid" id="recentlyViewed"></div>
  </div>
</section>

<div class="zoom-lightbox" id="zoomLightbox">
  <button class="zoom-close" onclick="document.getElementById('zoomLightbox').classList.remove('open')">CLOSE ✕</button>
  <img id="zoomImage" src="" alt="">
</div>

<div id="site-footer"></div>

<script src="js/components.js"></script>
<script src="js/cart.js"></script>
<script src="js/wishlist.js"></script>
<script src="firebase/firebase-config.js"></script>
<script src="firebase/firebase-helpers.js"></script>
<script src="firebase/firestore.js"></script>
<script src="js/main.js"></script>
<script src="js/product.js"></script>
<script>
  document.getElementById('productMainImage')?.addEventListener('click', () => {
    document.getElementById('zoomImage').src = document.getElementById('productMainImage').src;
  });
</script>
</body>
</html>
