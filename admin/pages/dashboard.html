<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — Tivora Admin</title>
<link rel="icon" href="../../assets/icons/favicon.png">
<link rel="stylesheet" href="../css/admin.css">
<link rel="stylesheet" href="../css/admin-responsive.css">
</head>
<body>
<div class="admin-shell">
  <div id="admin-sidebar"></div>
  <main class="admin-main">
    <div class="admin-topbar">
      <h1>Dashboard</h1>
      <span id="adminWelcome" class="muted" style="color:var(--a-muted); font-size:0.85rem;"></span>
    </div>

    <div class="stat-grid" id="statGrid">
      <!-- populated by dashboard.js -->
    </div>

    <div class="admin-panel">
      <h2>Recent Orders</h2>
      <div style="overflow-x:auto;">
        <table class="admin-table" id="recentOrdersTable">
          <thead><tr><th>Order</th><th>Customer</th><th>Total</th><th>Status</th><th>Date</th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
      <div class="admin-empty" id="recentOrdersEmpty" hidden>No orders yet — they'll appear here as they come in.</div>
    </div>

    <div class="admin-panel">
      <h2>Custom Couture Requests</h2>
      <div style="overflow-x:auto;">
        <table class="admin-table" id="recentCoutureTable">
          <thead><tr><th>Name</th><th>Event</th><th>Status</th><th>Date</th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
      <div class="admin-empty" id="recentCoutureEmpty" hidden>No custom requests yet.</div>
    </div>
  </main>
</div>

<script src="../../firebase/firebase-config.js"></script>
<script src="../../firebase/firebase-helpers.js"></script>
<script src="../../firebase/auth.js"></script>
<script src="../../firebase/firestore.js"></script>
<script src="../js/admin.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/dashboard.js"></script>
</body>
</html>
