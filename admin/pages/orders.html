<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orders — Tivora Admin</title>
<link rel="icon" href="../../assets/icons/favicon.png">
<link rel="stylesheet" href="../css/admin.css">
<link rel="stylesheet" href="../css/admin-responsive.css">
</head>
<body>
<div class="admin-shell">
  <div id="admin-sidebar"></div>
  <main class="admin-main">
    <div class="admin-topbar"><h1>Orders</h1></div>

    <div class="admin-panel" id="orderDetailsPanel" hidden></div>

    <div class="admin-panel">
      <div style="overflow-x:auto;">
        <table class="admin-table" id="ordersTable">
          <thead><tr><th>Order</th><th>Customer</th><th>Items</th><th>Total</th><th>Status</th><th></th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
      <div class="admin-empty" id="ordersEmpty" hidden>No orders yet — they'll appear here as customers check out.</div>
    </div>
  </main>
</div>

<script src="../../firebase/firebase-config.js"></script>
<script src="../../firebase/firebase-helpers.js"></script>
<script src="../../firebase/auth.js"></script>
<script src="../../firebase/firestore.js"></script>
<script src="../js/admin.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/orders.js"></script>
</body>
</html>
