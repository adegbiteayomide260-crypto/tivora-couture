<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Customers — Tivora Admin</title>
<link rel="icon" href="../../assets/icons/favicon.png">
<link rel="stylesheet" href="../css/admin.css">
<link rel="stylesheet" href="../css/admin-responsive.css">
</head>
<body>
<div class="admin-shell">
  <div id="admin-sidebar"></div>
  <main class="admin-main">
    <div class="admin-topbar"><h1>Customers</h1></div>
    <div class="admin-panel">
      <div style="overflow-x:auto;">
        <table class="admin-table" id="customersTable">
          <thead><tr><th>Name</th><th>Phone</th><th>Email</th><th>Orders</th><th>Confirmed + Completed Spend</th><th></th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
      <div class="admin-empty" id="customersEmpty" hidden>No customers yet — this fills in as orders and enquiries come through.</div>
    </div>
  </main>
</div>

<script src="../../firebase/firebase-config.js"></script>
<script src="../../firebase/firebase-helpers.js"></script>
<script src="../../firebase/auth.js"></script>
<script src="../../firebase/firestore.js"></script>
<script src="../js/admin.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/customers.js"></script>
</body>
</html>
