<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Analytics — Tivora Admin</title>
<link rel="icon" href="../../assets/icons/favicon.png">
<link rel="stylesheet" href="../css/admin.css">
<link rel="stylesheet" href="../css/admin-responsive.css">
</head>
<body>
<div class="admin-shell">
  <div id="admin-sidebar"></div>
  <main class="admin-main">
    <div class="admin-topbar"><h1>Analytics</h1></div>

    <div class="stat-grid" id="analyticsGrid"></div>

    <div class="admin-panel">
      <h2>Recent Activity</h2>
      <div style="overflow-x:auto;">
        <table class="admin-table">
          <thead><tr><th>Type</th><th>Detail</th><th>Date</th></tr></thead>
          <tbody id="recentActivity"></tbody>
        </table>
      </div>
      <div class="admin-empty" id="recentActivityEmpty" hidden>No activity yet.</div>
    </div>
  </main>
</div>

<script src="../../firebase/firebase-config.js"></script>
<script src="../../firebase/firebase-helpers.js"></script>
<script src="../../firebase/auth.js"></script>
<script src="../../firebase/firestore.js"></script>
<script src="../js/admin.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/analytics.js"></script>
</body>
</html>
