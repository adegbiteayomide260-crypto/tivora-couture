<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login — Tivora Couture</title>
<link rel="icon" href="../assets/icons/favicon.png">
<link rel="stylesheet" href="css/admin.css">
<link rel="stylesheet" href="css/admin-responsive.css">
</head>
<body>
<div class="login-page">
  <div class="login-card">
    <h1>Tivora Admin</h1>
    <p class="sub">Sign in to manage the atelier</p>
    <div id="loginNotConfigured" hidden class="login-error" style="margin-bottom:1rem;"></div>
    <form class="admin-form" id="loginForm">
      <div class="field">
        <label for="loginEmail">Email</label>
        <input type="email" id="loginEmail" name="email" required autocomplete="username">
      </div>
      <div class="field">
        <label for="loginPassword">Password</label>
        <input type="password" id="loginPassword" name="password" required autocomplete="current-password">
      </div>
      <button type="submit" class="admin-btn" style="width:100%; justify-content:center;">Sign In</button>
      <p class="login-error" id="loginError"></p>
    </form>
  </div>
</div>

<script src="../firebase/firebase-config.js"></script>
<script src="../firebase/auth.js"></script>
<script>
  const form = document.getElementById('loginForm');
  const errorEl = document.getElementById('loginError');
  const notConfigured = document.getElementById('loginNotConfigured');

  if (!window.TIVORA_FIREBASE_READY) {
    notConfigured.hidden = false;
    notConfigured.textContent = 'Firebase isn\u2019t fully configured yet — add the real apiKey and appId to firebase/firebase-config.js, then set TIVORA_FIREBASE_READY = true.';
    form.querySelector('button').disabled = true;
  }

  // If already signed in as the verified admin, skip straight to the dashboard.
  if (window.TIVORA_FIREBASE_READY) {
    window.TivoraAuth.watchAuthState((user) => {
      if (user && user.uid === window.TIVORA_ADMIN_UID) window.location.href = 'pages/dashboard.html';
    });
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorEl.textContent = '';
    const email = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPassword').value;
    const btn = form.querySelector('button');
    btn.disabled = true; btn.textContent = 'Signing in…';

    try {
      const cred = await window.TivoraAuth.login(email, password);
      if (cred.user.uid !== window.TIVORA_ADMIN_UID) {
        await window.TivoraAuth.logout();
        throw new Error('This account is not authorized for the Tivora admin dashboard.');
      }
      window.location.href = 'pages/dashboard.html';
    } catch (err) {
      errorEl.textContent = err.message.replace('Firebase: ', '');
      btn.disabled = false; btn.textContent = 'Sign In';
    }
  });
</script>
</body>
</html>
