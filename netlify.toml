[build]
  publish = "."
  functions = "netlify/functions"
  command = "echo 'Static site — no build step required'"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
  from = "/admin"
  to = "/admin/index.html"
  status = 200
