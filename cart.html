<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Bag — Tivora Couture</title>
<link rel="icon" href="assets/icons/favicon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#3d0a19">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Tangerine:wght@400;700&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/responsive.css">
<link rel="stylesheet" href="css/animations.css">
<style>
  .cart-row { display: grid; grid-template-columns: 64px 1fr auto auto auto; gap: var(--space-sm); align-items: center; padding-block: var(--space-sm); border-bottom: 1px solid var(--line); }
  .cart-row-img { width: 64px; height: 80px; object-fit: cover; }
  .cart-row-info { display: flex; flex-direction: column; gap: 2px; }
  .qty-control { display: flex; align-items: center; border: 1px solid var(--line); }
  .qty-control button { border: none; background: none; width: 32px; height: 36px; }
  .qty-control input { width: 36px; border: none; text-align: center; padding: 0; }
  .remove-btn { background: none; border: none; color: var(--ink-500); }
  .cart-summary { max-width: 360px; margin-left: auto; margin-top: var(--space-lg); border-top: 1px solid var(--line); padding-top: var(--space-md); }
  .cart-summary .row { display: flex; justify-content: space-between; margin-bottom: var(--space-sm); font-size: 1.1rem; }
  .cart-summary .btn { width: 100%; margin-top: var(--space-sm); }
</style>
</head>
<body>
<div id="site-header"></div>

<header class="page-banner">
  <div class="container">
    <p class="breadcrumb">HOME / CART</p>
    <h1>Your Bag</h1>
  </div>
</header>

<section class="section">
  <div class="container">
    <div id="cartList"></div>
    <div class="empty-state" id="cartEmpty" hidden>
      <div class="glyph">Tivora</div>
      <p>Your bag is empty. Explore the collection to find your next piece.</p>
      <div class="actions"><a href="shop.html" class="btn btn-primary">Browse the Collection</a></div>
    </div>
    <div class="cart-summary" id="cartSummary" hidden>
      <div class="row"><span>Subtotal</span><span id="cartSubtotal">₦0</span></div>
      <p class="muted" style="font-size:0.85rem;">Delivery calculated at checkout.</p>
      <a href="checkout.html" class="btn btn-primary">Proceed to Checkout</a>
      <a href="shop.html" class="btn-text mt-lg" style="display:block; text-align:center;">Continue Shopping</a>
    </div>
  </div>
</section>

<div id="site-footer"></div>

<script src="js/components.js"></script>
<script src="js/cart.js"></script>
<script src="js/wishlist.js"></script>
<script src="firebase/firebase-helpers.js"></script>
<script src="js/main.js"></script>
</body>
</html>
