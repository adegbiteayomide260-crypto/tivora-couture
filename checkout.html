<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout — Tivora Couture</title>
<link rel="icon" href="assets/icons/favicon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#3d0a19">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Tangerine:wght@400;700&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/responsive.css">
<link rel="stylesheet" href="css/animations.css">
<style>
  .checkout-layout { display: grid; gap: var(--space-xl); grid-template-columns: 1fr; }
  @media (min-width: 900px) { .checkout-layout { grid-template-columns: 1fr 0.85fr; } }
  .checkout-item { display: grid; grid-template-columns: 48px 1fr auto; gap: var(--space-sm); align-items: center; padding-block: var(--space-xs); border-bottom: 1px solid var(--line); }
  .checkout-item img { width: 48px; height: 60px; object-fit: cover; }
  .checkout-total { display: flex; justify-content: space-between; font-size: 1.2rem; padding-top: var(--space-sm); }
</style>
</head>
<body>
<div id="site-header"></div>

<header class="page-banner">
  <div class="container">
    <p class="breadcrumb">HOME / CART / CHECKOUT</p>
    <h1>Checkout</h1>
  </div>
</header>

<section class="section">
  <div class="container checkout-layout">
    <form class="form-grid" id="checkoutForm">
      <h3>Delivery Details</h3>
      <div class="field-row">
        <div class="field"><label for="fullName">Full Name</label><input type="text" id="fullName" name="fullName" required></div>
        <div class="field"><label for="phone">WhatsApp / Phone</label><input type="tel" id="phone" name="phone" required></div>
      </div>
      <div class="field"><label for="email">Email</label><input type="email" id="email" name="email" required></div>
      <div class="field"><label for="address">Delivery Address</label><input type="text" id="address" name="address" required></div>
      <div class="field-row">
        <div class="field"><label for="city">City</label><input type="text" id="city" name="city" required></div>
        <div class="field"><label for="state">State</label><input type="text" id="state" name="state" required></div>
      </div>
      <div class="field"><label for="notes">Order Notes (optional)</label><textarea id="notes" name="notes" rows="3"></textarea></div>
      <button type="submit" class="btn btn-primary">Place Order</button>
    </form>

    <div id="checkoutConfirmation" hidden></div>

    <aside>
      <h3>Order Review</h3>
      <div id="checkoutReview"></div>
    </aside>
  </div>
</section>

<div id="site-footer"></div>

<script src="js/components.js"></script>
<script src="js/cart.js"></script>
<script src="js/wishlist.js"></script>
<script src="firebase/firebase-helpers.js"></script>
<script src="js/main.js"></script>
<script src="js/checkout.js"></script>
</body>
</html>
